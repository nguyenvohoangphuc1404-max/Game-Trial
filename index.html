<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Hiệp Sĩ RPG</title>
    <link rel="stylesheet" href="đồ họa.css">
</head>

<body>

    <!-- =====================
         MÀN HÌNH CHỌN CLASS
    ====================== -->

    <div id="class-screen">

        <h1>⚔️ HIỆP SĨ RPG</h1>

        <p>Chọn class của bạn</p>

        <div id="classes">

            <button class="class-button" data-class="warrior">
                ⚔️
                <b>Kiếm sĩ</b>
                <span>Đánh gần - Damage cao</span>
            </button>

            <button class="class-button" data-class="archer">
                🏹
                <b>Cung thủ</b>
                <span>Bắn xa - Nhanh</span>
            </button>

            <button class="class-button" data-class="mage">
                🔮
                <b>Pháp sư</b>
                <span>Phép thuật - Đánh xa</span>
            </button>

        </div>

    </div>


    <!-- =====================
         GAME
    ====================== -->

    <div id="game-screen">

        <!-- STATUS -->

        <div id="status">

            <div>Class: <span id="class-name">---</span></div>

            <div>⚔️ Level: <span id="level">1</span></div>

            <div>
                ⭐ EXP:
                <span id="exp">0</span>/<span id="exp-needed">70</span>
            </div>

            <div>
                💥 Damage:
                <span id="damage">10</span>
            </div>

            <div>
                ❤️ HP:
                <span id="player-hp">100</span>/100
            </div>

        </div>


        <!-- MAP -->

        <div id="game">

            <!-- CÂY -->

            <div class="tree" style="left: 80px; top: 70px;">🌳</div>

            <div class="tree" style="left: 650px; top: 60px;">🌲</div>

            <div class="tree" style="left: 100px; top: 350px;">🌳</div>

            <div class="tree" style="left: 680px; top: 350px;">🌳</div>

            <div class="tree" style="left: 400px; top: 60px;">🌲</div>


            <!-- PLAYER -->

            <div id="player">⚔️</div>


            <!-- ENEMY -->

            <div id="enemy">

                <div id="enemy-character">👾</div>

                <div id="enemy-hp">
                    HP: 30/30
                </div>

            </div>


            <!-- BOSS -->

            <div id="boss">

                <div id="boss-character">👹</div>

                <div id="boss-hp">
                    BOSS HP: 150/150
                </div>

            </div>

        </div>


        <div id="message">
            WASD để di chuyển • SPACE để tấn công
        </div>

    </div>


    <script src="game.js"></script>

</body>

</html>
